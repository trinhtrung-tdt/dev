<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hỗ trợ người dùng - AppName</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    <nav class="bg-white border-b border-gray-200 py-4">
        <div class="max-w-4xl mx-auto px-4">
            <a href="index.html" class="font-bold text-lg text-gray-900">← Quay lại Trang chủ</a>
        </div>
    </nav>

    <div class="max-w-2xl mx-auto px-4 py-12">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-900">Trung tâm Hỗ trợ</h1>
            <p class="text-gray-600 mt-2">Bạn gặp khó khăn hay phát hiện lỗi trong quá trình sử dụng? Hãy phản hồi ngay cho chúng tôi.</p>
        </div>

        <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
            <!-- Contact Card -->
            <div class="space-y-6">
                <div class="flex items-center space-x-4 p-4 bg-indigo-50 rounded-xl">
                    <div class="w-12 h-12 bg-indigo-600 text-white rounded-lg flex items-center justify-center text-xl">
                        <i class="fa-solid fa-envelope"></i>
                    </div>
                    <div>
                        <div class="text-sm text-gray-500">Email hỗ trợ trực tiếp</div>
                        <a href="mailto:your-email@gmail.com" class="font-bold text-indigo-700 text-lg hover:underline">your-email@gmail.com</a>
                    </div>
                </div>

                <div class="flex items-center space-x-4 p-4 bg-gray-50 rounded-xl">
                    <div class="w-12 h-12 bg-gray-800 text-white rounded-lg flex items-center justify-center text-xl">
                        <i class="fa-brands fa-github"></i>
                    </div>
                    <div>
                        <div class="text-sm text-gray-500">Báo lỗi trên GitHub (dành cho Dev)</div>
                        <a href="https://github.com/your-username/your-repo/issues" target="_blank" class="font-bold text-gray-800 hover:underline">Tạo GitHub Issue</a>
                    </div>
                </div>
            </div>

            <div class="mt-8 pt-6 border-t border-gray-100 text-xs text-center text-gray-500">
                Thời gian phản hồi thông thường trong vòng 24 - 48 giờ làm việc.
            </div>
        </div>
    </div>
</body>
</html>
